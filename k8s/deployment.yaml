# Production Kubernetes manifests for sentrix-evaluator.
#
# The FastAPI application serves Prometheus metrics at GET /metrics on port
# 8000, so no separate metrics container/port is required. Liveness and
# readiness both probe GET /health.
#
# Apply with:  kubectl apply -f k8s/deployment.yaml
#
# Sensitive values live in the `sentrix-secrets` Secret (replace the
# template values / switch to external-secrets in a real cluster). Non-sensitive
# settings live in the `sentrix-config` ConfigMap.

---
apiVersion: v1
kind: Secret
metadata:
  name: sentrix-secrets
  labels:
    app: sentrix-api
type: Opaque
stringData:
  DATABASE_URL: postgresql://sentrix:sentrix@postgres:5432/sentrix_db
  REDIS_URL: redis://redis:6379/0
  LITELLM_MASTER_KEY: sk-mock-key-1234

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentrix-config
  labels:
    app: sentrix-api
data:
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "sentrix"
  POSTGRES_DB: "sentrix_db"
  LOG_LEVEL: "INFO"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentrix-api
  labels:
    app: sentrix-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: /metrics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentrix-api
  template:
    metadata:
      labels:
        app: sentrix-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: sentrix-api
          image: sentrix-evaluator:v0.6.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: sentrix-secrets
            - configMapRef:
                name: sentrix-config
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus-multiproc
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: prometheus-multiproc
              mountPath: /tmp/prometheus-multiproc
      volumes:
        - name: prometheus-multiproc
          emptyDir:
            medium: Memory
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: sentrix-api
  labels:
    app: sentrix-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: /metrics
spec:
  selector:
    app: sentrix-api
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
