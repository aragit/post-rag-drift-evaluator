name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-flight:
    name: Pre-Flight Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libffi-dev build-essential

      - name: Install Python Build & Tooling Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build ruff mypy pytest

      - name: Install Project with Dev Dependencies
        run: |
          pip install -e ".[dev,ui]"

      - name: Run Pre-Flight Checks
        run: |
          chmod +x scripts/pre_flight_check.sh
          ./scripts/pre_flight_check.sh

  docker-build:
    name: Docker Build & Verify
    needs: pre-flight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: sentrix-evaluator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
