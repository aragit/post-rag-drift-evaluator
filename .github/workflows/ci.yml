name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: drift_db
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5433"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5433/drift_db
  REDIS_URL: redis://localhost:6379/0
  LITELLM_MASTER_KEY: sk-mock-key-1234

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d drift_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Ruff Linter
        run: |
          rm -rf build/ dist/ *.egg-info
          ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Mypy Static Type Check
        run: mypy --ignore-missing-imports evaluator/ api/

      - name: Execute Test Suite
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drift_db
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/drift_db
          REDIS_URL: redis://localhost:6379/0
          LITELLM_MASTER_KEY: sk-mock-key-1234
        run: |
          pytest tests/ -v --durations=10

  docker-build-and-verify:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker Image
        run: |
          docker build \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache,mode=max \
            -t drift-engine:latest .

      - name: Start services via Docker Compose
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_db
          POSTGRES_PORT: 5432
        run: |
          echo "POSTGRES_USER=postgres" > .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "POSTGRES_DB=rag_db" >> .env
          echo "POSTGRES_HOST=db" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          echo "REDIS_URL=redis://redis:6379/0" >> .env
          echo "DATABASE_URL=postgresql://postgres:postgres@db:5432/rag_db" >> .env
          echo "LITELLM_MASTER_KEY=sk-mock-key-1234" >> .env
          docker compose up -d --build
          echo "Waiting for Docker services to be ready..."
          timeout 60 bash -c 'until docker compose exec -T db pg_isready -U postgres -d rag_db; do sleep 2; done'

      - name: Wait for API readiness
        run: |
          echo "Waiting for API readiness..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/readyz; do sleep 2; done'

      - name: Run e2e verification
        env:
          API_BASE_URL: http://localhost:8000
          POSTGRES_HOST: db
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_db
          REDIS_URL: redis://redis:6379/0
          DATABASE_URL: postgresql://postgres:postgres@db:5432/rag_db
        run: |
          python scripts/verify_docker_stack.py

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down -v
