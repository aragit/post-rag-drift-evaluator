name: sentrix-evaluator
services:
  sentrix-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentrix-evaluator:v0.6.1
    container_name: sentrix-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: sentrix
      POSTGRES_PASSWORD: sentrix
      POSTGRES_DB: sentrix_db
      # asyncpg-native scheme (asyncpg REJECTS the "postgresql+asyncpg://" SQLAlchemy form)
      DATABASE_URL: postgresql://sentrix:sentrix@postgres:5432/sentrix_db
      REDIS_URL: redis://redis:6379/0
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-mock-key-1234}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - sentrix-data:/app/data
    networks:
      - sentrix-network

  postgres:
    image: postgres:15-alpine
    container_name: sentrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentrix
      POSTGRES_PASSWORD: sentrix
      POSTGRES_DB: sentrix_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentrix -d sentrix_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sentrix-network

  redis:
    image: redis:7-alpine
    container_name: sentrix-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - redis-data:/data
    networks:
      - sentrix-network

volumes:
  postgres-data:
  redis-data:
  sentrix-data:

networks:
  sentrix-network:
    driver: bridge
