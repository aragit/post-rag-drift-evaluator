[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrix-evaluator"
version = "0.1.0"
description = "Causal evaluation and optimization engine for AI systems"
requires-python = ">=3.9"
dependencies = [
    "polars>=1.0.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.1",
    "python-json-logger>=2.0.0",
    "litellm>=1.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "fakeredis>=2.20.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "alembic>=1.13.0",
]

[project.scripts]
sentrix = "cli.sentrix_cli:main"
drift-cli = "cli.drift_cli:main"
sentrix-serve = "evaluator.api.app:app"

[tool.setuptools.packages.find]
include = ["evaluator*", "scripts*", "api*", "ingestion*", "alerting*", "cli*"]

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = [
    "build",
    "dist",
    ".venv",
    "*.egg-info",
    ".git",
    "__pycache__",
    ".agents",
    "core_source_code.md",
    "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "DTZ"]
ignore = ["E501"]

[tool.ruff.format]
exclude = [
    "core_source_code.md",
    "*.md",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"